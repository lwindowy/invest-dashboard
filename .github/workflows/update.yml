name: 데이터 갱신과 배포

# 30분마다 데이터를 받아 GitHub Pages에 배포한다.
# 예약 실행은 기본 브랜치(main)에서만 돌고, GitHub 사정으로 몇 분~수십 분 늦을 수 있다.
on:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fresh:
        description: 이전 데이터 없이 시작 (쌓아 둔 이력이 사라집니다)
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      # 수집에 실패한 항목은 지금 사이트에 떠 있는 값으로 대신한다
      - name: 이전 데이터 받기
        # 이전 데이터에는 매일 쌓는 값(포워드 PER 추이)이 들어 있다. 못 받으면 그 이력이 사라지므로 배포하지 않고 멈춘다.
        # 처음부터 새로 만들 때만 Actions 탭에서 '이전 데이터 없이 시작'을 켜고 직접 실행한다.
        run: |
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 "${{ steps.pages.outputs.base_url }}/data/dashboard.json" -o "$RUNNER_TEMP/prev.json" \
            || [ "${{ inputs.fresh }}" = "true" ]

      # 장기 재무(SEC)는 하루 한 번만 받는다. 이전 파일이 없으면 새로 받으면 되므로 실패해도 계속한다
      - name: 이전 장기 재무 받기
        continue-on-error: true
        run: curl -fsSL --retry 3 --retry-delay 10 --max-time 60 "${{ steps.pages.outputs.base_url }}/data/financials.json" -o "$RUNNER_TEMP/financials.json"

      # 스크리너 표(나스닥 100 + 관심 종목)도 하루 한 번만 받는다. prev.json 옆에 두면 수집 스크립트가 찾는다
      - name: 이전 스크리너 표 받기
        continue-on-error: true
        run: curl -fsSL --retry 3 --retry-delay 10 --max-time 60 "${{ steps.pages.outputs.base_url }}/data/screener.json" -o "$RUNNER_TEMP/screener.json"

      # S&P 500 지도(산업 탭)의 종목 목록·주식 수도 일주일에 한 번만 다시 받는다
      - name: 이전 S&P 500 지도 받기
        continue-on-error: true
        run: curl -fsSL --retry 3 --retry-delay 10 --max-time 60 "${{ steps.pages.outputs.base_url }}/data/map.json" -o "$RUNNER_TEMP/map.json"

      # Claude 예약 작업이 ai-results 브랜치에 저장한 AI 뉴스 분류 결과와 회사 소개. 없으면 없는 채로 계속한다
      - name: AI 뉴스 분류 결과와 회사 소개 받기
        continue-on-error: true
        run: |
          git fetch --depth=1 origin ai-results
          for f in news_ai.json profiles.json; do
            if git cat-file -e "FETCH_HEAD:$f" 2>/dev/null; then git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/$f"; fi
          done

      - name: 데이터 수집
        run: python scripts/fetch_data.py --prev "$RUNNER_TEMP/prev.json"

      # 브라우저가 예전 화면 파일을 붙잡고 있지 않도록, 파일 주소에 이번 커밋 번호를 붙인다
      - name: 화면 파일에 버전 붙이기
        run: sed -i -E "s/(style\.css|app\.js)\"/\1?v=${GITHUB_SHA::8}\"/" site/index.html && grep -E "style.css|app.js" site/index.html

      # 공개 저장소는 60일 동안 변경이 없으면 예약 실행이 꺼진다.
      # 워크플로를 '켜기'로 다시 지정하면 그 기한이 새로 시작된다. 실패해도 배포는 계속한다.
      - name: 예약 실행이 꺼지지 않게 하기
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/enable"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
