name: 관심 종목 추가·삭제

# 사이트의 "종목 추가" 칸에서 보낸 요청(이슈)을 처리한다.
# 저장소 주인이 만든 요청만 처리하고, 제목이 "종목 추가: TSLA" / "종목 삭제: TSLA" 형식이어야 한다.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: watchlist
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '종목 ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # 요청 내용은 환경 변수로만 넘긴다(명령어에 직접 끼워 넣지 않는다)
      - name: 설정 파일 고치기
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/watchlist.py

      - name: 저장하고 다시 배포
        run: |
          if [ -f commit.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config/dashboard.json
            git commit -F commit.txt
            git push origin HEAD:main
            # 종목을 넣었으면 갱신이 끝난 뒤 회사 소개를 바로 쓰도록 티커를 넘긴다
            if [ -f added.txt ]; then
              gh workflow run update.yml --ref main -f new_stock="$(head -c 20 added.txt | tr -cd 'A-Za-z0-9.-')"
            else
              gh workflow run update.yml --ref main
            fi
          fi

      - name: 결과 알리고 요청 닫기
        if: always()
        run: |
          [ -f result.md ] || echo "처리 중 오류가 났습니다. Actions 탭의 실행 기록을 확인해 주세요." > result.md
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file result.md
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
